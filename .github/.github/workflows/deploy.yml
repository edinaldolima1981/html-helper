indentação/estrutura YAML quebrada (por isso ele “não regular” branches, runs-on, secrets, etc.). Substitua o conteúdo inteiro .github/workflows/deploy.ymlpor este, exatamente (incluindo espaços):

name: Deploy to Hostinger VPS

on:
 push:
 branches:
 - main

jobs:
 deploy:
 runs-on: ubuntu-latest
 steps:
 - name: Deploy on Hostinger VPS
 uses: hostinger/deploy-on-hostinger-vps@v1
 with:
 hostinger_api_key: ${{ secrets.HOSTINGER_API_KEY }}
 virtual_machine_id: "1381634"
